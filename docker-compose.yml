services:
  wb2api:
    build: .
    image: workbuddy2api:local
    container_name: workbuddy2api
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "0.0.0.0:7863:7863"
    volumes:
      - /mnt/user/appdata/workbuddy2api/auths:/app/auths
      - /mnt/user/appdata/workbuddy2api/data:/app/data
      - /mnt/user/appdata/workbuddy2api/config.json:/app/config.json:ro
